name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-linux:
    name: Build on Linux (GCC)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libraylib-dev clang-format

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build

    - name: Check code formatting
      run: |
        clang-format --dry-run --Werror src/main.c

  build-macos:
    name: Build on macOS (Clang)
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        brew install raylib clang-format

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build

    - name: Check code formatting
      run: |
        clang-format --dry-run --Werror src/main.c

  build-windows:
    name: Build on Windows (MSVC)
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: '8eb57355a4ffb410a2e94c07b4dca2dffbee8e50'

    - name: Install Raylib via vcpkg
      run: |
        vcpkg install raylib:x64-windows

    - name: Configure CMake
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_TOOLCHAIN_FILE="${env:VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"

    - name: Build
      run: cmake --build build --config Release

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: raylib_app-windows
        path: build/Release/raylib_app.exe

  formatting-check:
    name: Code Formatting Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install clang-format
      run: sudo apt-get install -y clang-format

    - name: Check formatting
      run: |
        clang-format --dry-run --Werror src/main.c
        if [ $? -ne 0 ]; then
          echo "Code is not properly formatted. Run 'clang-format -i src/main.c' to fix."
          exit 1
        fi
        echo "Code formatting is correct!"
